<body>
    <h1>Student's t-Test</h1>

    <p><strong>Description:</strong> Student's t-test is used to compare means of two independent samples.</p>

    <p><strong>Preconditions:</strong></p>
    <ul>
        <li>Samples must be independent.</li>
    </ul>

    <p><strong>Implications and Consequences:</strong></p>
    <ul>
        <li>If the p-value is less than the chosen significance level, the null hypothesis of equal means is rejected.</li>
    </ul>
</body>
